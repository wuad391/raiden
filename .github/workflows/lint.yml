name: Lint

on:
  push:
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      # Pin ruff so contributor-local versions don't drift from CI
      # (an unpinned `uvx ruff` resolves to the latest release at run time,
      # and minor versions can change formatter output — see commit c7b1ccb).
      - run: uvx ruff@0.15.12 format --check .
      - run: uvx ruff@0.15.12 check .
