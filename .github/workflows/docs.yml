name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install doc dependencies
        run: pip install "mkdocs>=1.5,<2.0" "mkdocs-material>=9.0" "mkdocstrings[python]>=0.24" "numpy>=1.24"

      - name: Build HTML docs
        run: mkdocs build --strict

      # Only upload the Pages artifact on the canonical repo where
      # Pages is configured to consume it.  Forks still validate the
      # docs build above; the deploy job below is also gated on the
      # canonical repo, so the upload+deploy pair is skipped together.
      - if: github.repository == 'tri-ml/raiden'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    # GitHub Pages is only enabled on the canonical upstream repo.
    # Skipping on forks (e.g. wuad391/raiden) avoids a 404 from
    # actions/deploy-pages on every push to main.
    if: github.repository == 'tri-ml/raiden'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
